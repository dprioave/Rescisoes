.wrap{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px}
.brand{display:flex;align-items:center;gap:14px;min-width:0;flex:1 1 320px}
.brand img{height:28px;width:auto}
.brand h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand small{display:block;color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:7px 13px;cursor:pointer;color:var(--fg)}
.btn:hover{border-color:rgba(255,255,255,.25)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a0d10;font-weight:600}
.btn.danger{color:var(--bad);border-color:rgba(229,88,79,.4)}
.btn.small{padding:3px 9px;font-size:12px}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.sync{font:12px var(--mono);color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.off{background:var(--warn)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.badge{font:11px var(--mono);background:var(--bad);color:#fff;border-radius:9px;padding:1px 7px;margin-left:6px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters select,.filters input,.field input,.field select,.field textarea{background:rgba(10,13,18,.6);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
.filters input{flex:1 1 200px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;backdrop-filter:blur(10px);min-width:0}
.card h2{font-size:13px;font-weight:600;margin:0 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi .v{font:500 30px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12px;margin-top:4px}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.months{display:flex;align-items:flex-end;gap:8px;height:190px}
.m{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.m .n{font:12px var(--mono);font-variant-numeric:tabular-nums}
.m .bar{width:100%;max-width:44px;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.m.cur .bar{background:var(--info)}
.m .lab{font-size:11px;color:var(--muted)}
.hb{display:flex;flex-direction:column;gap:7px}
.hb .r{display:grid;grid-template-columns:minmax(90px,38%) 1fr 34px;gap:8px;align-items:center;font-size:13px}
.hb .r span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .track{height:10px;background:rgba(255,255,255,.07);border-radius:5px;overflow:hidden}
.hb .fill{height:100%;background:var(--accent);border-radius:5px}
.hb .c{font:12px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:500 11px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top}
tbody tr{cursor:pointer} tbody tr:hover{background:rgba(255,255,255,.04)}
td.mono{font:12px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.fb{background:none;border:0;padding:2px 4px;margin:-2px -4px;border-radius:4px;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.fb:hover{background:rgba(255,255,255,.07);color:var(--fg)}.fb .ic{font-size:9px;color:var(--accent)}.fb .fun{opacity:.55}.fb.active{color:var(--accent)}.fb.active .fun{opacity:1}
.pop{position:fixed;z-index:30;background:#1b222d;border:1px solid rgba(255,255,255,.16);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.5);padding:6px;display:flex;flex-direction:column;gap:2px;max-height:min(480px,90vh)}
.pi{background:none;border:0;text-align:left;padding:7px 9px;border-radius:5px;cursor:pointer;color:var(--fg);font-size:13px}.pi:hover:not(:disabled){background:rgba(255,255,255,.08)}.pi:disabled{color:var(--muted);cursor:default}
.sep{height:1px;background:var(--line);margin:3px 0}
.ps{background:rgba(10,13,18,.7);border:1px solid var(--line);border-radius:5px;padding:6px 9px;margin:2px 3px;min-width:0}
.pl{overflow-y:auto;min-height:60px;max-height:220px;border:1px solid var(--line);border-radius:5px;margin:3px;padding:3px;display:flex;flex-direction:column}
.po{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:13px}.po:hover{background:rgba(255,255,255,.06)}.po span{min-width:0;overflow-wrap:anywhere}
.pf{display:flex;justify-content:flex-end;gap:8px;padding:6px 3px 2px}.pf .btn:disabled{opacity:.45;cursor:default}
.pg{display:flex;align-items:center}.pg .po{flex:1;min-width:0}.tg{background:none;border:0;color:var(--muted);cursor:pointer;width:22px;height:22px;padding:0;font-size:11px}.tg:hover{color:var(--fg)}.po.in{padding-left:30px}.gn{color:var(--muted);font-size:11px;margin-left:auto;white-space:nowrap}
td.nm{min-width:200px}td.emp{min-width:210px}
td .sub{color:var(--muted);font-size:12px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:rgba(78,159,107,.5)} .pill.warn{color:var(--warn);border-color:rgba(227,168,85,.5)} .pill.bad{color:var(--bad);border-color:rgba(229,88,79,.5)} .pill.info{color:var(--info);border-color:rgba(126,180,234,.5)}
.empty{color:var(--muted);padding:24px;text-align:center}
.count{color:var(--muted);font-size:12px;margin:0 0 8px}
.modal-bg{position:fixed;inset:0;background:rgba(5,7,10,.7);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow-y:auto;z-index:10}
.modal{background:#161c25;border:1px solid var(--line);border-radius:12px;padding:20px;width:100%;max-width:640px;display:flex;flex-direction:column;gap:14px}
.modal h3{margin:0;font-size:16px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.field.full{grid-column:1/-1}.hint{font-size:12px;color:var(--muted)}.chk{display:flex;align-items:center;gap:8px;color:var(--fg)!important;font-size:13px!important;padding:7px 0}.chk input{width:auto}
.field textarea{min-height:64px;resize:vertical}
.mfoot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#222b38;border:1px solid var(--line);padding:9px 16px;border-radius:8px;z-index:20}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
@media (max-width:600px){.kpi .v{font-size:26px}.hb .r{grid-template-columns:minmax(80px,42%) 1fr 30px}}
@media (prefers-reduced-motion:no-preference){.fill,.bar{transition:width .3s,height .3s}}
</style>

<script>
(function(){
"use strict";
var MESES=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
var MESES_L=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
var TIPOS=["AVISO TRABALHADO","AVISO INDENIZADO","PEDIDO DE DEMISSÃO","TÉRMINO EXPERIÊNCIA","TÉRMINO ESTÁGIO","JUSTA CAUSA","RESC. ANTECIPADA","FALECIMENTO"];
var EMPRESAS=["AUGURI","BOSSA","CIDADE JARDIM","EQUIPAMENTOS","INVESTIMENTOS","JARDINS ANGELA VIEIRA","MARIE CURIE","RAÍZES","SUBHOLDING","UNIQUE","VILA NINITA","VIVANT","ESSENZA"].sort();
var db=null, canWrite=true, rows=[], loaded=false, docs={};
var F={emp:"",tipo:"",mes:"",q:""};
var CFV={};
var S={col:"",dir:1};
var TXT={empresa:1,nome:1,tipo:1,sit:1};
function sortKey(r,k){
  switch(k){
    case "empresa":return norm(razao(r));
    case "matricula":return r.matricula===""||r.matricula==null?null:(isNaN(Number(r.matricula))?norm(r.matricula):Number(r.matricula));
    case "nome":return norm(r.nome);
    case "tipo":return norm(r.tipo);
    case "aviso":return r.dataAviso||null;
    case "deslig":return r.dataDeslig||null;
    case "pgto":return r.dataPgto||null;
    case "titulos":var n=Number(r.tituloResc);return isNaN(n)||r.tituloResc===""?null:n;
    case "sit":return norm(status(r).t);
  }
}
function cmpSort(a,b){
  var x=sortKey(a,S.col),y=sortKey(b,S.col);
  if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1;
  if(typeof x!==typeof y){x=String(x);y=String(y)}
  return (x<y?-1:x>y?1:0)*S.dir;
}
var COLS=[["empresa","Empresa"],["matricula","Matrícula"],["nome","Colaborador"],["tipo","Tipo"],["aviso","Aviso"],["deslig","Desligamento"],["pgto","Pagamento"],["titulos","Títulos"],["sit","Situação"]];
function valueOf(r,k){
  switch(k){
    case "empresa":return razao(r);
    case "matricula":return mat(r.matricula);
    case "nome":return (r.nome||"").trim();
    case "tipo":return r.tipo||"";
    case "aviso":return r.dataAviso?fd(r.dataAviso):"";
    case "deslig":return r.dataDeslig?fd(r.dataDeslig):"";
    case "pgto":return r.dataPgto?fd(r.dataPgto):"";
    case "titulos":return (r.tituloResc==null||r.tituloResc===""?"—":r.tituloResc)+" / "+(r.tituloGfd==null||r.tituloGfd===""?"—":r.tituloGfd);
    case "sit":return status(r).t;
  }
  return "";
}
var hoje=iso(new Date());
var RAZAO={"UNIQUE":"RESERVA DO PAIVA SPE 03 LTDA","AUGURI":"RIO AVE CARNEIROS 01 SPE LTDA","VILA NINITA":"RIO AVE POCO DA PANELA SPE LTDA","NINITA":"RIO AVE POCO DA PANELA SPE LTDA","MARIE CURIE":"CONDOMINIO DO EDIFICIO EMPRESARIAL MARIE CURIE","RAÍZES":"RIO AVE OASIS TORRE 1 SPE LTDA","JARDINS ANGELA VIEIRA":"RIO AVE 200 SPE LTDA","SUBHOLDING":"RIO AVE SUBHOLDING INCORPORACAO LTDA","INVESTIMENTOS":"RIO AVE INVESTIMENTOS LTDA","CIDADE JARDIM":"RIO AVE CIDADE JARDIM SPE LTDA","EQUIPAMENTOS":"RIO AVE EQUIPAMENTOS LTDA","ESSENZA":"RESERVA DO PAIVA SPE 01 LTDA","BOSSA":"RIO AVE 130 SPE LTDA"};
function razao(r){return RAZAO[r.empresa]||r.empresa||""}

function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fd(s){if(!s)return "—";var p=s.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function mat(m){var s=String(m==null?"":m).trim();return /^\d+$/.test(s)&&s.length<6?("000000"+s).slice(-6):s}
function norm(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function mk(r){return (r.dataDeslig||"").slice(0,7)}
function $(id){return document.getElementById(id)}
function toast(t){var e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2600)}

function status(r){
  if(r.validacao==="OK")return {k:"ok",t:"Validada",pend:false};
  if(r.dataDeslig>hoje)return {k:"info",t:"Agendada",pend:false};
  if(r.dataPgto&&r.dataPgto<hoje)return {k:"bad",t:"Pagamento vencido",pend:true};
  if(r.dataPgto&&diasAte(r.dataPgto)<=7)return {k:"warn",t:"Pagar até "+fd(r.dataPgto).slice(0,5),pend:true};
  return {k:"warn",t:"Aguardando validação",pend:true};
}
function diasAte(d){return Math.round((new Date(d+"T12:00")-new Date(hoje+"T12:00"))/864e5)}

function filtered(exceptCol){
  var q=norm(F.q);
  return rows.filter(function(r){
    if(F.emp&&razao(r)!==F.emp)return false;
    if(F.tipo&&r.tipo!==F.tipo)return false;
    if(F.mes&&mk(r)!==F.mes)return false;
    if(q&&norm(r.nome+" "+r.matricula+" "+r.funcao).indexOf(q)<0)return false;
    for(var k in CFV){if(k!==exceptCol&&CFV[k]&&CFV[k].indexOf(valueOf(r,k))<0)return false}
    return true;
  }).sort(function(a,b){
    if(S.col){var c=cmpSort(a,b);if(c)return c}
    return a.dataDeslig<b.dataDeslig?1:a.dataDeslig>b.dataDeslig?-1:norm(a.nome)<norm(b.nome)?-1:1});
}

function fillFilters(){
  function opts(id,label,vals,cur,fmt){
    var el=$(id),h='<option value="">'+label+'</option>';
    vals.forEach(function(v){h+='<option value="'+esc(v)+'"'+(v===cur?" selected":"")+'>'+esc(fmt?fmt(v):v)+'</option>'});
    el.innerHTML=h;
  }
  function uniq(k){var s={};rows.forEach(function(r){if(r[k])s[r[k]]=1});return Object.keys(s).sort()}
  var es={};rows.forEach(function(r){es[razao(r)]=1});
  opts("fEmp","Todas as empresas",Object.keys(es).sort(),F.emp);
  opts("fTipo","Todos os tipos",uniq("tipo"),F.tipo);
  var ms={};rows.forEach(function(r){if(mk(r))ms[mk(r)]=1});
  opts("fMes","Todos os meses",Object.keys(ms).sort(),F.mes,function(v){var p=v.split("-");return MESES_L[+p[1]-1]+"/"+p[0]});
}

function tituloTxt(v){return v==null||v===""?"—":v}
function renderLista(list){
  
  var nCF=Object.keys(CFV).length;
  var h='<div class="card"><p class="count">'+list.length+' de '+rows.length+' rescisões · clique numa linha para ver ou editar'+(nCF?' · <button class="btn small" id="clearCF">Limpar filtros das colunas</button>':'')+'</p><div class="tw"><table><thead><tr>'+COLS.map(function(c){var on=S.col===c[0],fa=!!CFV[c[0]];return '<th aria-sort="'+(on?(S.dir>0?"ascending":"descending"):"none")+'"><button class="fb'+(fa?" active":"")+'" data-col="'+c[0]+'" aria-haspopup="true" title="Filtrar e ordenar">'+c[1]+'<span class="ic">'+(on?(S.dir>0?"▲":"▼"):"")+'</span><svg class="fun" viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path d="M1 2h10L7 6.5V10L5 11V6.5z" fill="'+(fa?"currentColor":"none")+'" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg></button></th>'}).join("")+'</tr></thead><tbody>';

var POP=null;
function closeFilter(){if(POP){POP.remove();POP=null}}
function openFilter(col,btn){
  closeFilter();
  var label=COLS.filter(function(c){return c[0]===col})[0][1];
  var base=filtered(col), map={};
  base.forEach(function(r){var v=valueOf(r,col);if(!(v in map))map[v]=r});
  var vals=Object.keys(map).sort(function(a,b){
    var x=sortKey(map[a],col),y=sortKey(map[b],col);
    if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;
    if(typeof x!==typeof y){x=String(x);y=String(y)}
    return x<y?-1:x>y?1:0});
  var sel={};
  vals.forEach(function(v){sel[v]=CFV[col]?CFV[col].indexOf(v)>=0:true});
  var tx=TXT[col]?1:0, date=(col==="aviso"||col==="deslig"||col==="pgto");
  var lA=tx?"Classificar de A a Z":date?"Classificar da mais antiga para a mais nova":"Classificar do menor para o maior";
  var lZ=tx?"Classificar de Z a A":date?"Classificar da mais nova para a mais antiga":"Classificar do maior para o menor";
  var el=document.createElement("div");el.className="pop";el.setAttribute("role","dialog");el.setAttribute("aria-label","Filtro de "+label);
  el.innerHTML='<button class="pi" data-a="asc">'+esc(lA)+'</button><button class="pi" data-a="desc">'+esc(lZ)+'</button><div class="sep"></div><button class="pi" data-a="clear"'+(CFV[col]?"":" disabled")+'>Limpar filtro de “'+esc(label)+'”</button><div class="sep"></div><input class="ps" type="search" placeholder="Pesquisar" aria-label="Pesquisar valores"><div class="pl"></div><div class="pf"><button class="btn small" data-a="cancel">Cancelar</button><button class="btn small primary" data-a="ok">OK</button></div>';
  document.body.appendChild(el);POP=el;
  var list=el.querySelector(".pl"),ps=el.querySelector(".ps");
  function visible(){var q=norm(ps.value);return vals.filter(function(v){return !q||norm(v===""?"(vazias)":v).indexOf(q)>=0})}
  var open={};
  function compKey(v){var p=v.split("/");return v===""?"":p[2]+"-"+p[1]}
  function compLabel(k){return k===""?"(Vazias)":MESES_L[+k.slice(5)-1]+"/"+k.slice(0,4)}
  function draw(){
    var vis=visible(),all=vis.length&&vis.every(function(v){return sel[v]}),some=vis.some(function(v){return sel[v]});
    var h='<label class="po"><input type="checkbox" data-all="1"'+(all?" checked":"")+'> <span>(Selecionar tudo)</span></label>';
    var groups=[];
    if(date){
      var gm={};
      vis.forEach(function(v,i){var k=compKey(v);if(!gm[k]){gm[k]={k:k,items:[]};groups.push(gm[k])}gm[k].items.push(i)});
      groups.forEach(function(g){
        var n=g.items.length,c=g.items.filter(function(i){return sel[vis[i]]}).length;
        var ex=!!ps.value||open[g.k];
        h+='<div class="pg"><button class="tg" data-gt="'+g.k+'" aria-expanded="'+ex+'" title="'+(ex?"Recolher":"Expandir")+'">'+(ex?"▾":"▸")+'</button><label class="po"><input type="checkbox" data-gc="'+g.k+'"'+(c===n?" checked":"")+'> <span>'+esc(compLabel(g.k))+'</span><small class="gn">'+n+(n===1?" data":" datas")+'</small></label></div>';
        if(ex&&g.k!=="")g.items.forEach(function(i){h+='<label class="po in"><input type="checkbox" data-i="'+i+'"'+(sel[vis[i]]?" checked":"")+'> <span>'+esc(vis[i])+'</span></label>'});
      });
    }else{
      vis.forEach(function(v,i){h+='<label class="po"><input type="checkbox" data-i="'+i+'"'+(sel[v]?" checked":"")+'> <span>'+(v===""?"(Vazias)":esc(v))+'</span></label>'});
    }
    if(!vis.length)h+='<div class="hint" style="padding:8px">Nenhum valor encontrado.</div>';
    var sc=list.scrollTop;
    list.innerHTML=h;list.scrollTop=sc;
    var a=list.querySelector("[data-all]");a.indeterminate=!all&&some;
    a.onchange=function(){vis.forEach(function(v){sel[v]=a.checked});draw()};
    Array.prototype.forEach.call(list.querySelectorAll("[data-i]"),function(c){c.onchange=function(){sel[vis[+c.getAttribute("data-i")]]=c.checked;draw()}});
    groups.forEach(function(g){
      var cb=list.querySelector('[data-gc="'+g.k+'"]');
      var c=g.items.filter(function(i){return sel[vis[i]]}).length;
      cb.indeterminate=c>0&&c<g.items.length;

      list.querySelector('[data-gt="'+g.k+'"]').onclick=function(){open[g.k]=!open[g.k];draw()};
    });
    el.querySelector('[data-a="ok"]').disabled=!vals.some(function(v){return sel[v]});
  }
  draw();
  ps.oninput=draw;
  el.onclick=function(e){
    var b=e.target.closest("button[data-a]");if(!b||b.disabled)return;
    var a=b.getAttribute("data-a");
    if(a==="asc"||a==="desc"){S.col=col;S.dir=a==="asc"?1:-1;closeFilter();render()}

  ps.focus();
}

/* Cálculo de datas: aviso trabalhado = aviso + 30 dias; pagamento = desligamento + 10 dias, antecipado para o dia útil anterior (fim de semana ou feriado). */
function addDias(s,n){var d=new Date(s+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function pascoa(y){var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;return y+"-"+(mes<10?"0":"")+mes+"-"+(dia<10?"0":"")+dia}
var FERIADOS_CACHE={};
function feriados(y){
  if(FERIADOS_CACHE[y])return FERIADOS_CACHE[y];
  var s={};
  ["01-01","03-06","03-12","04-21","05-01","06-24","07-16","09-07","10-12","11-02","11-15","11-20","12-08","12-25"].forEach(function(x){s[y+"-"+x]=1});
  var p=pascoa(y);[-48,-47,-2,60].forEach(function(n){s[addDias(p,n)]=1});
  return FERIADOS_CACHE[y]=s;
}
function diaUtil(s){
  for(var i=0;i<15;i++){
    var wd=new Date(s+"T12:00:00Z").getUTCDay();
    if(wd!==0&&wd!==6&&!feriados(+s.slice(0,4))[s])return s;
    s=addDias(s,-1);
  }
  return s;
}
function avisoTrabalhado(tipo,trab){return tipo==="AVISO TRABALHADO"||(tipo==="PEDIDO DE DEMISSÃO"&&!!trab)}
function calcDeslig(tipo,trab,aviso){return !aviso?"":(avisoTrabalhado(tipo,trab)?addDias(aviso,30):aviso)}
function calcPgto(deslig){return !deslig?"":diaUtil(addDias(deslig,10))}

  var h=ws.getRow(1);h.font={bold:true,color:{argb:"FFFFFFFF"}};h.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF1F2A3A"}};h.alignment={vertical:"middle",wrapText:true};h.height=26;
  ws.views=[{state:"frozen",ySplit:1}];

function importSeed(file){
  if(!file||!db)return;
  var fr=new FileReader();
  fr.onload=function(){
    var arr;try{arr=JSON.parse(fr.result)}catch(e){toast("Arquivo inválido.");return}
    if(!Array.isArray(arr)||!arr.length){toast("Arquivo sem registros.");return}
    var chunks=[];for(var i=0;i<arr.length;i+=400)chunks.push(arr.slice(i,i+400));
    var p=Promise.resolve();
    chunks.forEach(function(ch){p=p.then(function(){var b=db.batch();ch.forEach(function(x){var id=x.id;var d=Object.assign({},x);delete d.id;b.set(db.collection("rescisoes").doc(id),d)});return b.commit()})});
    p.then(function(){toast(arr.length+" rescisões importadas")},function(){toast("Não foi possível importar. Verifique as regras do Firestore.")});
  };
  fr.readAsText(file);
}
